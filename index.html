            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            var protoFetch = proto.fetch;
            Object.defineProperty(proto, 'fetch', {
              get: function() {
                return protoFetch;
              },
              set: function(newFetch) {
                protoFetch = newFetch;
              },
              configurable: true,
              enumerable: true
            });
          } catch (err) {}
        }
      })();
    </script>
